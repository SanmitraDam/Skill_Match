version: '3.8'

services:
  skillmatch-edge-pop:
    image: skillmatch/planetary-edge-node:v8.0.0
    container_name: skillmatch_edge_pop
    restart: always
    environment:
      - PORT=8000
      - EDGE_REGION=EU-CENTRAL
      - VLLM_PAGED_ATTENTION_EDGE=true
      - SUB_10MS_ROUTING_ACTIVE=true
      - STABLECOIN_NETWORK=POLYGON_ARBITRUM
      - PROMETHEUS_METRICS=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
